name: Cloud configuration

on:
  pull_request:
    paths: ['cloud/**', 'scripts/convex-provider-secrets*', 'flake.*', '.github/workflows/cloud.yml']
  push:
    branches: [main]
    paths: ['cloud/**', 'scripts/convex-provider-secrets*', 'flake.*', '.github/workflows/cloud.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Validate without cloud credentials
        run: |
          nix develop .#cloud --command tofu fmt -check -recursive cloud
          for stack in cloud/llm/bootstrap/azure cloud/llm/azure; do
            nix develop .#cloud --command tofu -chdir="$stack" init -backend=false -input=false -lockfile=readonly
            nix develop .#cloud --command tofu -chdir="$stack" validate
          done
          python3 scripts/convex-provider-secrets.test.py
