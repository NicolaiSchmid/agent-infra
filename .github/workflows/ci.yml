name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prometheus-dashboard:
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Test quota charts
        run: node hosts/forge/prometheus/dashboard/test_graph.mjs
      - name: Test quota collector
        run: python3 -m unittest discover -s hosts/forge/prometheus/dashboard -p 'test_*.py'

  convex-callback-patch:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: patches/convex-callback-headers/package-lock.json
      - name: Test pinned callback transport patch
        working-directory: patches/convex-callback-headers
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

  nix:
    # Atlas includes large tool bundles; use the organization's Linux runner pool.
    runs-on: ubicloud-standard-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Test backup and routing guards
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/storage-box -p 'test_*.py'
          python3 scripts/checked-routing-step.test.py
          python3 scripts/t3code-bootstrap.test.py
          python3 scripts/hosted-runner-runbook.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/june-alert.test.py
      - name: Check flake
        run: nix flake check --show-trace

  darwin-agents:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Build Forge configuration and release runtimes
        run: nix build .#darwinConfigurations.forge.system --no-link --show-trace
