name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  nix:
    # Atlas includes large tool bundles; use the organization's Linux runner pool.
    runs-on: ubicloud-standard-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Test scoped activation health
        run: |
          python3 scripts/activate-routing-only.test.py
          python3 scripts/checked-routing-step.test.py
      - name: Check flake
        run: nix flake check --show-trace
