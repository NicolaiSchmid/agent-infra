# Host Tailscale plugin -> Atlas; independent of tower-arr.
# RAM-only bounded queue: never spool to the USB boot device or array.
*.* action(type="omfwd" target="100.122.138.66" port="5514"
  protocol="tcp" template="RSYSLOG_SyslogProtocol23Format"
  action.resumeRetryCount="-1" action.resumeInterval="5"
  queue.type="LinkedList" queue.size="4096"
  queue.timeoutEnqueue="0")
