# Single-node Garage for the Convex deployments' file storage and backups.
# Secrets come from the environment (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN,
# GARAGE_METRICS_TOKEN), written once by garage-secrets.service.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
metadata_auto_snapshot_interval = "6h"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
