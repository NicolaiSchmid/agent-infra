# Copy to /opt/prometheus/config.yaml in the forge-linux VM and fill in the
# two secrets. Never commit the real file. Full reference:
# https://github.com/router-for-me/CLIProxyAPI/blob/main/config.example.yaml
config-version: 8

server:
  # Shares the tailscale container's network namespace; Tailscale Serve is
  # the only way in.
  host: "127.0.0.1"
  port: 8317
  trusted-proxies: ["127.0.0.1", "::1"]

management:
  allow-remote: true
  # Plaintext here is hashed on first start. Empty disables the panel/API.
  secret-key: "<management key>"
  # Panel is baked into the image (Dockerfile, pinned + reviewed); never
  # replace it from GitHub at runtime.
  disable-auto-update-panel: true
  panel-github-repository: "https://github.com/Fwindy/Cli-Proxy-API-Management-Center"

access:
  # What Claude Code (ANTHROPIC_AUTH_TOKEN) and Codex send.
  api-keys:
    - "<client access key>"

routing:
  strategy: "round-robin"
  session-affinity: true
  session-affinity-ttl: "1h"
  retry:
    request-retry: 3
    max-retry-interval: 30

oauth:
  auth-dir: "/root/.cli-proxy-api"

observability:
  usage:
    usage-statistics-enabled: true

# Baked into the image by ./Dockerfile (pinned + checksummed).
plugins:
  enabled: true
  dir: "plugins"
  configs:
    codex-auto-reset:
      enabled: true
      priority: 1
      refresh_interval: "1m"
      trigger_lead_time: "3m"
      # Select account auth_index values in the plugin panel after login.
      # Empty keeps redemption inactive until accounts are selected.
      enabled_accounts: []
      state_dir: "/root/.cli-proxy-api/plugin-state/codex-auto-reset"
    usage-statistics:
      enabled: true
      priority: 100
      data_dir: "/CLIProxyAPI/usage"
      retention_days: 0
