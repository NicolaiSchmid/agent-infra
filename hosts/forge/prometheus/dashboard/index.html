<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Prometheus · Quota</title>
<style>
:root{--bg:#090a0b;--panel:#121416;--line:#26292e;--muted:#9399a3;--text:#f2f3f5;--claude:#eea183;--codex:#89adff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a,select{font:inherit}button,select{color:var(--text);background:#1b1e22;border:1px solid var(--line);border-radius:9px;padding:9px 14px;cursor:pointer}button:hover,a:hover{filter:brightness(1.2)}button:disabled{opacity:.5;cursor:wait}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{border-right:1px solid #202226;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:700;letter-spacing:-.7px;display:flex;align-items:center;gap:10px}.mark{background:#efaa83;color:#16110e;border-radius:10px;width:33px;height:33px;display:grid;place-items:center;font-size:23px}nav{display:grid;gap:7px;margin-top:48px}nav a{padding:11px 13px;color:var(--muted);border-radius:8px}nav .active{background:#222529;color:white}.aside-foot{margin-top:auto;padding:12px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8dcbb0;margin-right:6px}main{padding:42px 4vw 50px;min-width:0;max-width:1800px;width:100%;margin:auto}.eyebrow{color:var(--muted);font-size:11px;font-weight:650;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:30px;line-height:1.2;letter-spacing:-1px;margin:7px 0 10px}h2{font-size:18px;margin:0}.subtitle{color:var(--muted);margin:0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.actions{display:flex;gap:9px}.primary{background:#e8eaed;color:#101113;font-weight:600;border-color:transparent}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:24px}.tabs{display:flex;padding:4px;background:#141619;border:1px solid #24272b;border-radius:11px;gap:3px}.tabs button{border:0;background:transparent;padding:7px 14px;color:var(--muted)}.tabs button.selected{background:#2a2d33;color:white}.tools{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px}.notice{border:1px solid #51442b;background:#211d15;color:#dfc38d;padding:12px 16px;border-radius:10px;margin-bottom:20px}.panel{background:var(--panel);border:1px solid #212429;border-radius:16px;margin:0 0 22px;overflow:hidden}.panel-head{padding:24px 26px 0;display:flex;align-items:center;gap:10px}.provider-icon{font-size:25px;color:var(--accent)}.badge{font-size:11px;color:var(--muted);border:1px solid #363a42;border-radius:5px;padding:2px 7px;margin-left:4px}.metrics{padding:18px 26px 6px;display:flex;gap:35px;align-items:center;justify-content:space-between}.big{font-size:44px;font-weight:600;letter-spacing:-2px;line-height:1.15}.big small{font-size:13px;color:var(--muted);letter-spacing:0;font-weight:400;margin-left:8px}.metric-label{font-size:12px;color:var(--muted);margin-bottom:5px}.metric-value{font-size:14px}.chart{height:255px;margin:12px 20px 0;position:relative}.chart svg{display:block;width:100%;height:100%;overflow:visible}.legend{display:flex;gap:22px;flex-wrap:wrap;padding:12px 26px 21px;color:var(--muted);font-size:11px}.legend span:before{content:'';display:inline-block;width:19px;height:2px;background:var(--accent);vertical-align:middle;margin-right:8px}.legend .projected:before{background:repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 7px)}.accounts{border-top:1px solid var(--line);padding:0 26px}.account{display:grid;grid-template-columns:minmax(170px,1.7fr) 1fr 1fr 1fr;gap:20px;padding:16px 0;border-bottom:1px solid #25282d;align-items:center}.account:last-child{border:0}.account .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.small{font-size:11px;color:var(--muted)}.bar{background:#2b2e34;height:4px;border-radius:4px;margin-top:7px;overflow:hidden}.bar i{height:100%;display:block;background:var(--accent);border-radius:4px}.error{color:#edb38c}.empty{padding:65px 25px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;padding:3px 2px}.history-note{font-size:11px;color:var(--muted);padding:0 26px 18px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1100px){.shell{grid-template-columns:175px 1fr}aside{padding:25px 12px}.brand{font-size:17px}main{padding:30px 24px}.metrics{gap:18px;flex-wrap:wrap}.big{font-size:38px}.account{grid-template-columns:1.5fr 1fr 1fr}.account .last-seen{display:none}}
@media(max-width:720px){.shell{display:block}aside{position:static;height:auto;flex-direction:row;padding:14px 18px;border-right:0;border-bottom:1px solid var(--line);justify-content:space-between;align-items:center}.brand{font-size:17px}nav{display:flex;margin:0}nav a{padding:6px 9px;font-size:12px}nav .active,.aside-foot{display:none}main{padding:25px 16px}.top{align-items:flex-start;gap:12px}h1{font-size:26px}.actions{flex-direction:column}.actions button{font-size:11px;padding:7px 9px}.subtitle{font-size:12px}.metrics{padding:17px 18px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.metrics>div:first-child{grid-column:1/-1}.panel-head{padding:20px 18px 0}.big{font-size:42px}.chart{height:220px;margin:0 10px}.accounts{padding:0 18px}.account{grid-template-columns:1fr 1fr;gap:12px}.account>div:first-child{grid-column:1/-1}.account .last-seen{display:block}.legend{padding-left:18px;gap:12px}footer{display:block}.tabs button{padding:6px 11px}.tools{width:100%;justify-content:space-between}.badge{font-size:10px}.history-note{padding-left:18px}}
</style></head><body><div class="shell"><aside><a class="brand" href="/dashboard/"><span class="mark">↗</span>prometheus</a><nav><a class="active" href="/dashboard/">◷ &nbsp; Quota overview</a><a href="/management.html" target="_blank" rel="noopener">⚙ &nbsp; Management ↗</a></nav><div class="aside-foot"><span class="dot"></span>Private tailnet<br><span style="padding-left:13px">Residential hub · Forge</span></div></aside><main><header class="top"><div><div class="eyebrow">Your subscription fleet</div><h1>Quota overview</h1><p class="subtitle" id="summary">Connecting to Prometheus…</p></div><div class="actions"><button id="emails">Show emails</button><button class="primary" id="refresh">↻ &nbsp; Refresh quotas</button></div></header><div class="toolbar"><div class="tabs" aria-label="Provider"><button class="selected" data-provider="all">All</button><button data-provider="claude">Claude</button><button data-provider="codex">Codex</button></div><div class="tools"><label>Quota window <select id="window"><option value="seven_day">Weekly</option><option value="five_hour">5 hour</option></select></label><label>History <select id="range"><option value="24">24 hours</option><option value="72" selected>3 days</option><option value="168">7 days</option><option value="336">14 days</option></select></label></div></div><div id="notice" role="status"></div><div id="panels"><div class="panel empty">Loading quota snapshots…</div></div><footer><span id="updated">Waiting for collector</span><span>Account-normalized quota · Refreshes every 5 minutes · Forecasts are estimates</span></footer></main></div>
<script>
'use strict';
let data=null,provider='all',showEmails=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=n=>Number(n).toFixed(n<10?1:0)+'%', date=t=>t?new Date(t*1000).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'}):'Unknown';
function ago(t){if(!t)return 'Never';const m=Math.max(0,Math.floor((Date.now()/1000-t)/60));return m<1?'just now':m<60?m+'m ago':Math.floor(m/60)+'h '+m%60+'m ago'}
function until(t){if(!t)return 'Unknown';let m=Math.ceil((t-Date.now()/1000)/60);if(m<=0)return 'Awaiting refresh';return m<60?'in '+m+'m':m<1440?'in '+Math.floor(m/60)+'h '+m%60+'m':'in '+Math.floor(m/1440)+'d '+Math.floor(m%1440/60)+'h'}
function graph(accounts,p,win,color){
 const ids=new Set(accounts.map(a=>a.id)), cutoff=data.now-Number($('range').value)*3600;
 const rows=data.history.filter(h=>ids.has(h.account)&&h.window===win&&h.ts>=cutoff);
 const buckets=new Map();for(const h of rows){if(!buckets.has(h.ts))buckets.set(h.ts,[]);buckets.get(h.ts).push(h)}
 // Only chart complete pools: a missing account must never look like consumed quota.
 const points=[...buckets].filter(([,v])=>new Set(v.map(r=>r.account)).size===accounts.length).map(([t,v])=>[t,v.reduce((s,r)=>s+r.remaining,0)]).sort((a,b)=>a[0]-b[0]);
 const last=accounts.reduce((s,a)=>s+a.windows.find(w=>w.name===win).remaining,0),cap=accounts.length*100;
 let burn=null;const rates=[];const accountRates=new Map();for(const a of accounts){const h=rows.filter(r=>r.account===a.id&&r.ts>=data.now-10800);let consumed=0,seconds=0;for(let i=1;i<h.length;i++){const prev=h[i-1],cur=h[i];if(cur.ts-prev.ts>1200||Math.abs((cur.reset||0)-(prev.reset||0))>60)continue;const delta=prev.remaining-cur.remaining;if(delta>=0){consumed+=delta;seconds+=cur.ts-prev.ts}}
 if(seconds>=1800){rates.push(consumed/seconds*3600);accountRates.set(a.id,consumed/seconds*3600)}}if(rates.length===accounts.length&&rates.length)burn=rates.reduce((a,b)=>a+b,0);
 const start=cutoff,end=data.now+12*3600,W=Math.max(320,document.querySelector('main').clientWidth-(innerWidth<=720?22:100)),H=220,L=48,R=14,T=13,B=31,x=t=>L+(t-start)/(end-start)*(W-L-R),y=v=>T+(1-v/cap)*(H-T-B);
 const path=points.map(([t,v],i)=>(i?'L':'M')+x(t).toFixed(1)+','+y(v).toFixed(1)).join(' ');
 let grid='';for(let i=0;i<=4;i++){const v=cap*i/4;grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#292c31"/><text x="${L-9}" y="${y(v)+4}" fill="#848b94" font-size="10" text-anchor="end">${Math.round(v)}%</text>`}const ticks=W<500?2:5;for(let i=0;i<=ticks;i++){const t=start+(end-start)*i/ticks;grid+=`<text x="${x(t)}" y="${H-8}" fill="#848b94" font-size="10" text-anchor="middle">${new Date(t*1000).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit'})}</text>`}
 const nx=x(data.now);let forecast='',projection=[];if(burn!==null){let t=data.now;const values=new Map(accounts.map(a=>[a.id,a.windows.find(w=>w.name===win).remaining])),total=()=>[...values.values()].reduce((a,b)=>a+b,0),advance=until=>{for(const [id,v] of values)values.set(id,Math.max(0,v-accountRates.get(id)*(until-t)/3600));t=until};const future=[[t,total()]],resets=accounts.map(a=>({id:a.id,reset:a.windows.find(w=>w.name===win).reset})).filter(w=>w.reset>data.now&&w.reset<end).sort((a,b)=>a.reset-b.reset);for(const reset of resets){advance(reset.reset);future.push([t,total()]);values.set(reset.id,100);future.push([t,total()])}advance(end);future.push([end,total()]);projection=future;forecast=`<path d="${future.map(([t,v],i)=>(i?'L':'M')+x(t).toFixed(1)+','+y(v).toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="5 5" opacity=".8"/>`}
 const fill=points.length?path+` L${x(points.at(-1)[0])},${y(0)} L${x(points[0][0])},${y(0)} Z`:'';
 return {burn,projection,html:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${p} remaining pooled quota over time"><defs><linearGradient id="fade-${p}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${color}" stop-opacity=".18"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${fill}" fill="url(#fade-${p})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.2"/>${forecast}<line x1="${nx}" x2="${nx}" y1="${T}" y2="${H-B}" stroke="#858992" opacity=".6"/><text x="${nx}" y="10" text-anchor="middle" fill="#b0b5bc" font-size="10">Now</text><circle cx="${nx}" cy="${y(last)}" r="4" fill="${color}"/>${points.length<2?`<text x="${L+20}" y="${H/2}" fill="#a4a9b1" font-size="12">${W<500?'Recording quota history…':'History is building. A snapshot is saved every 5 minutes.'}</text>`:''}</svg>`};
}
function render(){if(!data)return;const active=data.accounts.filter(a=>!a.disabled), fresh=a=>a.observed&&data.now-a.observed<=data.interval*2&&!a.error,win=$('window').value;
 $('summary').textContent=`${active.length} active accounts · ${active.filter(fresh).length} reporting · Claude + Codex`;
 const warnings=[];if(data.status.error)warnings.push(data.status.error);if(active.some(a=>!fresh(a)))warnings.push('Some accounts are unavailable or stale. Their last successful quota is shown below; stale accounts are excluded from the pool.');$('notice').innerHTML=warnings.length?`<div class="notice">${esc(warnings.join(' '))}</div>`:'';
 $('refresh').disabled=data.status.collecting;$('refresh').textContent=data.status.collecting?'Refreshing…':'↻  Refresh quotas';
 $('updated').textContent='Collector checked '+ago(data.status.last_attempt);
 $('panels').innerHTML=['claude','codex'].filter(p=>provider==='all'||provider===p).map(p=>{
 const all=data.accounts.filter(a=>a.provider===p), eligible=all.filter(a=>!a.disabled&&fresh(a)&&a.windows.some(w=>w.name===win)), color=p==='claude'?'#eea183':'#89adff',title=p==='claude'?'Claude':'Codex', sum=eligible.reduce((s,a)=>s+a.windows.find(w=>w.name===win).remaining,0),reset=eligible.flatMap(a=>a.windows.filter(w=>w.name===win&&w.reset>data.now).map(w=>w.reset)).sort((a,b)=>a-b)[0],g=eligible.length?graph(eligible,p,win,color):null;
 const metric=(label,value)=>`<div><div class="metric-label">${label}</div><div class="metric-value">${value}</div></div>`;
 return `<section class="panel" style="--accent:${color}"><div class="panel-head"><span class="provider-icon">${p==='claude'?'✳':'◈'}</span><h2>${title}</h2><span class="badge">${all.length} account${all.length===1?'':'s'}</span><span class="badge">${win==='seven_day'?'Weekly':'5 hour'}</span></div><div class="metrics"><div><div class="big">${eligible.length?pct(sum):'—'}<small>of ${eligible.length*100}%</small></div><div class="small">${eligible.length} fresh accounts · each account = 100%</div></div>${metric('Next reset',reset?esc(until(reset)):'Unknown')}${metric('Reset time',esc(date(reset)))}${metric('Burn · last 3h',g?.burn!==null&&g?.burn!==undefined?pct(g.burn)+'/h':'Building history')}${metric('Without future resets',g?.burn>0?esc(until(data.now+sum/g.burn*3600)):'—')}</div>${g?`<div class="chart">${g.html}</div><div class="legend"><span>Recorded quota</span><span class="projected">12h projection · constant recent burn</span></div>`:'<div class="empty">No fresh quota for this window. See account status below.</div>'}<div class="history-note">Pool percentages add account percentages; plans have different capacities. Forecasts use recent quota changes and known resets, not token counts.</div><div class="accounts">${all.map((a,i)=>{const w=a.windows.find(w=>w.name===win), label=showEmails?a.label:`${title} account ${i+1}`,status=a.disabled?'Disabled':a.error||(!fresh(a)?'Stale quota':a.plan||'Connected');return `<div class="account"><div><div class="name" title="${esc(label)}">${esc(label)}</div><div class="small ${a.error?'error':''}">${esc(status)}</div></div><div><div class="small">Remaining</div>${w?pct(w.remaining):'Unavailable'}<div class="bar"><i style="width:${w?w.remaining:0}%"></i></div></div><div><div class="small">Resets ${w?esc(until(w.reset)):''}</div>${w?esc(date(w.reset)):'—'}</div><div class="last-seen"><div class="small">Last successful check</div>${esc(ago(a.observed))}</div></div>`}).join('')||'<div class="empty">No accounts connected</div>'}</div></section>`}).join('');}
async function load(){try{const r=await fetch('/dashboard/api/state');if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();render()}catch(e){$('notice').innerHTML='<div class="notice">Cannot reach the dashboard collector. Retrying in 15 seconds.</div>'}}
document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>{provider=b.dataset.provider;document.querySelectorAll('[data-provider]').forEach(x=>x.classList.toggle('selected',x===b));render()});$('emails').onclick=()=>{showEmails=!showEmails;$('emails').textContent=showEmails?'Hide emails':'Show emails';render()};$('window').onchange=render;$('range').onchange=render;$('refresh').onclick=async()=>{try{const r=await fetch('/dashboard/api/refresh',{method:'POST',headers:{'X-Dashboard-Request':'1'}});if(!r.ok){$('notice').innerHTML='<div class="notice">'+(r.status===429?'Please wait one minute between refreshes.':'Refresh failed. The collector will retry automatically.')+'</div>';return}await load();setTimeout(load,3000)}catch{await load()}};load();setInterval(load,15000);
</script></body></html>
