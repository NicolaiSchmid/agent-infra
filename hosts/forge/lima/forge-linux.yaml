arch: aarch64
vmType: vz
cpus: 6
memory: 12GiB
disk: 100GiB

images:
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64

mounts: []

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y ca-certificates curl docker.io git jq unzip zip
      systemctl enable --now docker
      usermod -aG docker "{{.User}}"

      runner_version=2.337.0
      runner_archive="actions-runner-linux-arm64-${runner_version}.tar.gz"
      runner_url="https://github.com/actions/runner/releases/download/v${runner_version}/${runner_archive}"
      runner_sha256=9b1dc70626422526e3c94767cf024896beb15da5342a3f4819bf2feac13e0393

      install -d -o "{{.User}}" -g "{{.User}}" /opt/actions-runner
      if [ ! -x /opt/actions-runner/bin/Runner.Listener ]; then
        curl -fL --retry 3 -o "/tmp/${runner_archive}" "${runner_url}"
        echo "${runner_sha256}  /tmp/${runner_archive}" | sha256sum -c -
        tar -xzf "/tmp/${runner_archive}" -C /opt/actions-runner
        chown -R "{{.User}}:{{.User}}" /opt/actions-runner
        /opt/actions-runner/bin/installdependencies.sh
        rm -f "/tmp/${runner_archive}"
      fi

probes:
  - description: Docker is running
    script: |-
      #!/bin/sh
      systemctl is-active --quiet docker

message: |
  forge-linux is ready.
  Register the GitHub Actions runner in /opt/actions-runner after choosing its repository or organization scope.
